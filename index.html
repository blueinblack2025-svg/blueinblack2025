<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BB HOLDING | bluein black printing &amp; logistics — Pathanamthitta</title>
  <meta name="description" content="BB HOLDING in Pathanamthitta — bluein black printing &amp; logistics. Today's Special Offer: 25 to 50 Pieces Corporate Uniform with High Quality DTF Printed Logo @ 450/- INR." />
  <style>
    :root {
      --navy: #0b1f44;
      --navy-mid: #143269;
      --gold: #d97706;
      --gold-bright: #f59e0b;
      --bg-page: #f4f6fa;
      --bg-white: #ffffff;
      --text-dark: #0f172a;
      --text-muted: #475569;
      --border: #e2e8f0;
      --wa-green: #16a34a;
      --wa-hover: #15803d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-dark);
      font-size: 13.5px;
      line-height: 1.5;
      overflow-x: hidden;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* Top Strip */
    .top-strip {
      background: var(--navy);
      color: #e2e8f0;
      font-size: 12px;
      padding: 6px 5%;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      border-bottom: 2px solid var(--gold-bright);
    }

    .top-strip strong {
      color: #fbbf24;
    }

    /* Sticky Navbar */
    header {
      background: var(--bg-white);
      border-bottom: 1px solid var(--border);
      padding: 10px 5%;
      position: sticky;
      top: 0;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
    }

    .brand-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-box img {
      height: 38px;
      width: auto;
      object-fit: contain;
      background: var(--navy);
      padding: 3px 7px;
      border-radius: 5px;
    }

    .brand-titles {
      display: flex;
      flex-direction: column;
    }

    .brand-titles .b-main {
      font-size: 16px;
      font-weight: 800;
      color: var(--navy);
      line-height: 1.1;
      letter-spacing: 0.3px;
    }

    .brand-titles .b-sub {
      font-size: 11px;
      font-weight: 600;
      color: var(--gold);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
    }

    .nav-links a:hover {
      color: var(--navy);
    }

    .nav-actions {
      display: flex;
      gap: 8px;
    }

    .btn-top {
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: 0.15s;
    }

    .btn-top-navy {
      background: var(--navy);
      color: #ffffff;
    }

    .btn-top-navy:hover {
      background: var(--navy-mid);
    }

    .btn-top-gold {
      background: var(--gold-bright);
      color: #0f172a;
    }

    .btn-top-gold:hover {
      background: #eab308;
    }

    /* Hero Section + Projected Special Offer Card */
    .hero-section {
      background: linear-gradient(135deg, #0b1f44 0%, #153775 100%);
      color: #ffffff;
      padding: 28px 5% 32px;
    }

    .hero-grid {
      max-width: 1180px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 24px;
      align-items: center;
    }

    .hero-badge {
      display: inline-block;
      background: rgba(245, 158, 11, 0.18);
      border: 1px solid rgba(245, 158, 11, 0.5);
      color: #fcd34d;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 4px;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .hero-left h1 {
      font-size: clamp(23px, 2.9vw, 33px);
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 10px;
    }

    .hero-left h1 span {
      color: #fbbf24;
    }

    .hero-left p {
      font-size: 13px;
      color: #cbd5e1;
      margin-bottom: 16px;
    }

    .mini-divisions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .mini-div {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 7px;
      padding: 9px 12px;
    }

    .mini-div strong {
      display: block;
      font-size: 11.5px;
      color: #fbbf24;
      margin-bottom: 2px;
    }

    .mini-div span {
      font-size: 11px;
      color: #e2e8f0;
    }

    /* Scanner Animation Strip */
    .scanner-box {
      position: relative;
      background: rgba(6, 15, 36, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 7px;
      padding: 8px 12px;
      overflow: hidden;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #93c5fd;
    }

    .scanner-line {
      position: absolute;
      top: 0;
      left: -30%;
      width: 30%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.28), transparent);
      animation: scanSweep 2.8s linear infinite;
    }

    @keyframes scanSweep {
      0% { left: -30%; }
      100% { left: 100%; }
    }

    /* Projected Today's Special Offer Card */
    .offer-spotlight {
      position: relative;
      background: linear-gradient(145deg, #ffffff 0%, #fffbeb 100%);
      color: var(--navy);
      border-radius: 12px;
      padding: 20px 22px;
      border: 2.5px solid var(--gold-bright);
      box-shadow: 0 18px 38px rgba(0, 0, 0, 0.38), 0 0 0 4px rgba(245, 158, 11, 0.22);
    }

    .offer-ribbon {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #dc2626;
      color: #ffffff;
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 0.7px;
      padding: 4px 10px;
      border-radius: 4px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .offer-spotlight h2 {
      font-size: 16.5px;
      font-weight: 900;
      color: var(--navy);
      line-height: 1.3;
      margin-bottom: 10px;
    }

    .offer-price-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
      background: #fef3c7;
      border: 1.5px dashed #d97706;
      border-radius: 8px;
      padding: 9px 12px;
      margin-bottom: 10px;
    }

    .offer-price-row .only-txt {
      font-size: 11px;
      font-weight: 800;
      color: #92400e;
      text-transform: uppercase;
    }

    .offer-price-row .amount {
      font-size: 25px;
      font-weight: 900;
      color: #b45309;
      line-height: 1;
    }

    .offer-price-row .per-pc {
      font-size: 11.5px;
      font-weight: 700;
      color: #78350f;
    }

    .offer-points {
      list-style: none;
      margin-bottom: 12px;
      font-size: 12px;
      color: #1e293b;
    }

    .offer-points li {
      padding: 2px 0;
      font-weight: 600;
    }

    .offer-cta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-offer-wa {
      background: var(--wa-green);
      color: #ffffff;
      font-size: 12px;
      font-weight: 800;
      padding: 8px 14px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: 0.15s;
    }

    .btn-offer-wa:hover {
      background: var(--wa-hover);
    }

    .tc-small {
      font-size: 10px;
      color: #64748b;
      font-style: italic;
    }

    /* Sliding Courier Partner Bar */
    .courier-slider {
      background: var(--bg-white);
      border-bottom: 1px solid var(--border);
      padding: 10px 0;
      overflow: hidden;
      white-space: nowrap;
    }

    .slider-track {
      display: inline-flex;
      align-items: center;
      animation: slideCouriers 26s linear infinite;
    }

    .partner-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: 0 12px;
      padding: 4px 11px;
      border-radius: 5px;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--navy);
    }

    .partner-pill .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--gold-bright);
    }

    @keyframes slideCouriers {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    /* Main Content Wrapper */
    .wrapper {
      max-width: 1180px;
      margin: 0 auto;
      padding: 24px 5%;
    }

    .sec-title {
      margin-bottom: 14px;
    }

    .sec-title span {
      font-size: 10.5px;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--gold);
      letter-spacing: 0.8px;
    }

    .sec-title h2 {
      font-size: 18px;
      font-weight: 800;
      color: var(--navy);
    }

    /* Compact Quote Section (Below Hero) */
    .quote-section-box {
      background: var(--bg-white);
      border: 1px solid var(--border);
      border-top: 3px solid var(--navy);
      border-radius: 9px;
      padding: 15px 18px;
      margin-bottom: 26px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.04);
    }

    .quote-header-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 9px;
      border-bottom: 1px solid var(--border);
    }

    .quote-header-bar h3 {
      font-size: 14.5px;
      font-weight: 800;
      color: var(--navy);
    }

    .quote-tabs {
      display: inline-flex;
      background: #f1f5f9;
      padding: 3px;
      border-radius: 6px;
      gap: 4px;
    }

    .q-tab {
      border: none;
      background: transparent;
      padding: 5px 12px;
      border-radius: 5px;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
    }

    .q-tab.active {
      background: var(--navy);
      color: #ffffff;
    }

    .q-grid-compact {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 9px;
      margin-bottom: 10px;
    }

    .q-field label {
      display: block;
      font-size: 10.5px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 2px;
    }

    .q-field input,
    .q-field select {
      width: 100%;
      padding: 6px 9px;
      border: 1px solid #cbd5e1;
      border-radius: 5px;
      font-size: 12px;
      color: #0f172a;
      background: #ffffff;
      outline: none;
    }

    .q-field input:focus,
    .q-field select:focus {
      border-color: var(--navy);
    }

    .span-2 {
      grid-column: span 2;
    }

    .quote-footer-bar {
      display: flex;
      justify-content: flex-end;
    }

    .btn-wa-send {
      padding: 8px 18px;
      border: none;
      border-radius: 6px;
      background: var(--wa-green);
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.15s;
    }

    .btn-wa-send:hover {
      background: var(--wa-hover);
    }

    .hidden {
      display: none;
    }

    /* Compact 2-Column Division Cards */
    .div-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 16px;
      margin-bottom: 26px;
    }

    .corp-card {
      background: var(--bg-white);
      border: 1px solid var(--border);
      border-left: 4px solid var(--navy);
      border-radius: 8px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .corp-card.gold-edge {
      border-left-color: var(--gold-bright);
    }

    .corp-card h3 {
      font-size: 15px;
      font-weight: 800;
      color: var(--navy);
      margin-bottom: 5px;
    }

    .corp-card p {
      font-size: 12.5px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .corp-list {
      list-style: none;
      margin-bottom: 14px;
    }

    .corp-list li {
      font-size: 12px;
      color: #1e293b;
      padding: 4px 0;
      border-bottom: 1px dashed #e2e8f0;
    }

    .corp-list li:last-child {
      border-bottom: none;
    }

    .card-btns {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-sm-outline {
      padding: 6px 11px;
      border: 1px solid var(--navy);
      border-radius: 5px;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--navy);
      background: transparent;
      cursor: pointer;
    }

    .btn-sm-wa {
      padding: 6px 11px;
      border-radius: 5px;
      font-size: 11.5px;
      font-weight: 700;
      background: var(--wa-green);
      color: #ffffff;
    }

    /* Compact Courier Partners Grid */
    .net-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 12px;
      margin-bottom: 26px;
    }

    .net-box {
      background: var(--bg-white);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
    }

    .net-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 5px;
      gap: 6px;
    }

    .net-head h4 {
      font-size: 13.5px;
      font-weight: 800;
      color: var(--navy);
    }

    .net-tag {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      background: #eff6ff;
      color: #1d4ed8;
    }

    .net-box p {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    .net-sub {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--gold);
    }

    /* Compact Office Card */
    .office-bar {
      background: var(--bg-white);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 16px 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .office-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .office-logo {
      width: 82px;
      height: 82px;
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 5px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .office-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .office-text h3 {
      font-size: 15px;
      font-weight: 800;
      color: var(--navy);
      margin-bottom: 3px;
    }

    .office-text p {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Footer */
    footer {
      background: var(--navy);
      color: #cbd5e1;
      padding: 20px 5%;
      font-size: 11.5px;
      text-align: center;
      border-top: 3px solid var(--gold-bright);
    }

    @media (max-width: 920px) {
      .hero-grid {
        grid-template-columns: 1fr;
      }
      .q-grid-compact {
        grid-template-columns: repeat(2, 1fr);
      }
      .nav-links {
        display: none;
      }
    }

    @media (max-width: 540px) {
      .q-grid-compact {
        grid-template-columns: 1fr;
      }
      .span-2 {
        grid-column: span 1;
      }
    }
  </style>
</head>
