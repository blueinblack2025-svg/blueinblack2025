<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BB HOLDING at pathanamthitta | BLUEIN BLACK PRINTING &amp; LOGISTICS</title>
  <style>
    :root {
      --navy: #072257;
      --navy-dark: #04163a;
      --accent: #f59e0b;
      --white: #ffffff;
      --text-light: #e2e8f0;
      --card-bg: rgba(255, 255, 255, 0.08);
      --border-light: rgba(255, 255, 255, 0.16);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, var(--navy-dark) 0%, var(--navy) 65%, #0a2e75 100%);
      color: var(--white);
      min-height: 100vh;
    }

    .top-bar {
      height: 5px;
      background: var(--accent);
      width: 100%;
    }

    header {
      background: #ffffff;
      color: var(--navy);
      padding: 12px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
    }

    .brand-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .header-logo-box {
      background: #ffffff;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      padding: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      width: 92px;
      height: 56px;
    }

    .header-logo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 6px;
      display: block;
    }

    .brand-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.4px;
      color: var(--navy);
    }

    .division-pills {
      display: flex;
      gap: 8px;
      margin-top: 4px;
      flex-wrap: wrap;
    }

    .pill-printing {
      background: #dbeafe;
      color: #1e3a8a;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
    }

    .pill-logistics {
      background: #fef3c7;
      color: #92400e;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
    }

    nav {
      display: flex;
      gap: 22px;
      align-items: center;
      flex-wrap: wrap;
    }

    nav a {
      text-decoration: none;
      color: var(--navy);
      font-weight: 600;
      font-size: 14px;
    }

    .wa-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn-wa-printing {
      background: var(--navy);
      color: #ffffff;
      text-decoration: none;
      padding: 9px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
    }

    .btn-wa-logistics {
      background: var(--accent);
      color: var(--navy-dark);
      text-decoration: none;
      padding: 9px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
    }

    .hero {
      max-width: 1180px;
      margin: 0 auto;
      padding: 44px 32px 60px;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 36px;
      align-items: center;
    }

    .hero-logo-box {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      padding: 3px;
      width: 170px;
      height: 68px;
      border-radius: 10px;
      margin-bottom: 16px;
      overflow: hidden;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.28);
    }

    .hero-blueinblack-logo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 8px;
      display: block;
    }

    .hub-badge {
      display: block;
      width: fit-content;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.6px;
      padding: 6px 12px;
      border-radius: 4px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 42px;
      line-height: 1.15;
      font-weight: 800;
      margin-bottom: 16px;
    }

    h1 span {
      color: var(--accent);
    }

    .hero-sub {
      color: var(--text-light);
      font-size: 16px;
      line-height: 1.65;
      margin-bottom: 26px;
      max-width: 570px;
    }

    .hero-cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      max-width: 570px;
    }

    .mini-card {
      background: var(--card-bg);
      border: 1px solid var(--border-light);
      border-radius: 8px;
      padding: 14px 16px;
    }

    .mini-card h3 {
      font-size: 13px;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      color: #ffffff;
    }

    .mini-card p {
      font-size: 12px;
      color: var(--text-light);
    }

    .showcase-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .showcase-box {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      overflow: hidden;
    }

    .showcase-box img {
      width: 100%;
      height: 190px;
      object-fit: cover;
      display: block;
    }

    .showcase-label {
      background: rgba(4, 22, 58, 0.85);
      text-align: center;
      padding: 10px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.6px;
    }

    @media (max-width: 900px) {
      .hero {
        grid-template-columns: 1fr;
        padding: 28px 20px 44px;
      }

      h1 {
        font-size: 32px;
      }

      .hero-cards,
      .showcase-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="top-bar"></div>

  <header>
    <div class="brand-left">
      <!-- Top Header Logo -->
      <div class="header-logo-box">
        <img src="bnb-logo.png" alt="BB HOLDING Logo" class="header-logo" />
      </div>
      <div>
        <div class="brand-title">BB HOLDING</div>
        <div class="division-pills">
          <span class="pill-printing">BLUEIN BLACK PRINTING</span>
          <span class="pill-logistics">BLUEIN BLACK LOGISTICS</span>
        </div>
      </div>
    </div>

    <nav>
      <a href="#quote">Quick Quote</a>
      <a href="#divisions">Our Divisions</a>
      <a href="#network">Courier Network</a>
      <a href="#office">Office</a>
    </nav>
