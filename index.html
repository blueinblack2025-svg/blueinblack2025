<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>B&B HOLDING | BLUEIN BLACK Printing & BLUEIN BLACK Logistics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-blue: #0a2558;
      --deep-blue: #061738;
      --mid-blue: #163e8c;
      --accent-gold: #f59e0b;
      --accent-gold-hover: #d97706;
      --bg-page: #f4f7fb;
      --white: #ffffff;
      --border: #dbe3ef;
      --text-dark: #0f172a;
      --text-muted: #475569;
      --wa-green: #16a34a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; }
    html { scroll-behavior: smooth; }
    body { background: var(--bg-page); color: var(--text-dark); line-height: 1.55; overflow-x: hidden; }

    /* Top Umbrella Strip - B&B HOLDING */
    .umbrella-bar {
      background: var(--deep-blue);
      color: #ffffff;
      padding: 8px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.78rem;
      border-bottom: 2px solid var(--accent-gold);
    }
    .umbrella-title {
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--accent-gold);
      text-transform: uppercase;
    }
    .umbrella-contacts a {
      color: #e2e8f0;
      text-decoration: none;
      font-weight: 600;
    }
    .umbrella-contacts a:hover { color: var(--accent-gold); }

    /* Main Corporate Navbar */
    header {
      background: var(--white);
      padding: 12px 5%;
      position: sticky;
      top: 0;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 3px 16px rgba(10, 37, 88, 0.08);
    }
    .brand-group { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .brand-logo-img {
      height: 46px;
      width: auto;
      max-width: 140px;
      object-fit: contain;
      border-radius: 6px;
      background: #ffffff;
      padding: 2px;
    }
    .brand-badge {
      background: var(--primary-blue);
      color: var(--accent-gold);
      font-weight: 800;
      font-size: 1rem;
      padding: 9px 12px;
      border-radius: 8px;
      border-bottom: 3px solid var(--accent-gold);
      letter-spacing: 0.5px;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .brand-names h1 {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--primary-blue);
      line-height: 1.1;
      letter-spacing: 0.4px;
    }
    .brand-divisions-sub {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 3px;
      flex-wrap: wrap;
    }
    .sub-pill-print {
      font-size: 0.68rem;
      font-weight: 800;
      background: #e0e7ff;
      color: var(--primary-blue);
      padding: 2px 7px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }
    .sub-pill-log {
      font-size: 0.68rem;
      font-weight: 800;
      background: #fef3c7;
      color: #92400e;
      padding: 2px 7px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }

    .nav-links { display: flex; gap: 20px; align-items: center; }
    .nav-links a {
      text-decoration: none;
      color: var(--primary-blue);
      font-size: 0.85rem;
      font-weight: 700;
      transition: 0.2s;
    }
    .nav-links a:hover { color: var(--accent-gold-hover); }

    .header-btns { display: flex; gap: 8px; }
    .h-btn {
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 700;
      text-decoration: none;
      transition: 0.2s;
    }
    .h-btn-blue { background: var(--primary-blue); color: #fff; }
    .h-btn-gold { background: var(--accent-gold); color: var(--deep-blue); }

    /* Hero Banner */
    .hero {
      background: linear-gradient(120deg, var(--deep-blue) 0%, var(--primary-blue) 60%, var(--mid-blue) 100%);
      color: #ffffff;
      padding: 52px 5% 85px;
      position: relative;
    }
    .hero-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 36px;
      align-items: center;
    }
    .hero-tag {
      display: inline-block;
      background: rgba(245, 158, 11, 0.18);
      border: 1px solid rgba(245, 158, 11, 0.5);
      color: #fcd34d;
      font-size: 0.74rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      padding: 4px 12px;
      border-radius: 4px;
      margin-bottom: 14px;
      text-transform: uppercase;
    }
    .hero-logo-banner {
      height: 54px;
      width: auto;
      max-width: 240px;
      object-fit: contain;
      background: #ffffff;
      padding: 6px 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      display: inline-block;
    }
    .hero h2 {
      font-size: clamp(1.85rem, 3.4vw, 2.75rem);
      font-weight: 800;
      line-height: 1.18;
      margin-bottom: 14px;
    }
    .hero h2 span { color: var(--accent-gold); }
    .hero p {
      color: #cbd5e1;
      font-size: 0.96rem;
      margin-bottom: 22px;
      max-width: 560px;
    }
    .division-badges-hero {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .d-hero-box {
      background: rgba(255, 255, 255, 0.08);
      border-left: 3px solid var(--accent-gold);
      padding: 10px 14px;
      border-radius: 6px;
    }
    .d-hero-box strong { display: block; font-size: 0.88rem; color: #fff; }
    .d-hero-box span { font-size: 0.76rem; color: #cbd5e1; }

    .hero-visual-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .hero-visual-card {
      background
